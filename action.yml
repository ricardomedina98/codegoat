name: "codegoat review"
description: "AI-powered code review — posts inline review comments on pull requests"
author: "OpenGoat"

branding:
  icon: "eye"
  color: "orange"

inputs:
  api-key:
    description: "LLM API key (e.g. OpenAI API key)"
    required: true
  provider:
    description: "LLM provider"
    required: false
    default: "openai"
  model:
    description: "Model name (e.g. gpt-4o-mini)"
    required: false
    default: ""
  budget:
    description: "Max token budget for file content"
    required: false
    default: "100000"
  severity:
    description: "Minimum severity to show (critical, warning, info, style)"
    required: false
    default: "info"
  fail-on:
    description: "Exit 1 / REQUEST_CHANGES at this severity (none to disable)"
    required: false
    default: "critical"
  comment-mode:
    description: "PR comment mode: inline, summary, or log"
    required: false
    default: "inline"
  comment-severity:
    description: "Minimum severity for inline PR comments"
    required: false
    default: "warning"
  github-token:
    description: "GitHub token for posting PR comments (needs write permissions)"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install codegoat
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm ci
        npm run build

    - name: Run review
      shell: bash
      env:
        CODEGOAT_API_KEY: ${{ inputs.api-key }}
        CODEGOAT_PROVIDER: ${{ inputs.provider }}
        CODEGOAT_MODEL: ${{ inputs.model }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NO_COLOR: "1"
      run: |
        DIFF_FLAG=""
        COMMENT_FLAGS="--comment-mode ${{ inputs.comment-mode }} --comment-severity ${{ inputs.comment-severity }}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          DIFF_FLAG="--diff origin/${{ github.event.pull_request.base.ref }}...origin/${{ github.event.pull_request.head.ref }}"
        fi
        cd ${{ github.workspace }} && node ${{ github.action_path }}/dist/cli.js review . \
          $DIFF_FLAG \
          --budget ${{ inputs.budget }} \
          --severity ${{ inputs.severity }} \
          --fail-on ${{ inputs.fail-on }} \
          $COMMENT_FLAGS \
          --format markdown
